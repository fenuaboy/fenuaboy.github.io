<head>

<title>Filozen – la grille qui chasse le brouillard</title>

<link rel="icon" href="icon.png">
<style>
  :root{ --ink:#1B1640; --muted:#5f5a84; --bg:#ECEEFF; --blue:#2F6BFF }
  *{ box-sizing:border-box }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
    font:17px/1.6 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; padding:32px 16px; text-align:center }
  img{ width:128px; height:128px; border-radius:30px; box-shadow:0 8px 0 #D9DBF5 }

  h1 span:nth-child(1){color:#FF5D5D} h1 span:nth-child(2){color:#FFB400} h1 span:nth-child(3){color:#16C79A}
  h1 span:nth-child(4){color:#2F6BFF} h1 span:nth-child(5){color:#8A5CF6} h1 span:nth-child(6){color:#FF5D5D} h1 span:nth-child(7){color:#FFB400}
  p{ max-width:34ch; margin:8px auto; color:var(--muted); font-weight:600 }
  .soon{ display:inline-block; margin-top:14px; background:#fff; border-radius:14px; padding:10px 18px; font-weight:800; color:var(--ink); box-shadow:0 4px 0 #D9DBF5 }
  footer{ margin-top:36px; font-size:14px } footer a{ color:var(--blue); font-weight:700 }
</style>
</head>
<body>
<div>
  <img src="icon.png" alt="Filo, la mascotte de Filozen">
  <h1 aria-label="filozen"><span>f</span><span>i</span><span>l</span><span>o</span><span>z</span><span>e</span><span>n</span></h1>

</body>
